apiVersion: agent.k8s.elastic.co/v1alpha1
kind: Agent
metadata:
  name: ${FLEET_SERVER_NAME}
  namespace: ${ELASTIC_STACK_NAMESPACE}
spec:
  version: ${ELASTIC_STACK_VERSION}
  kibanaRef:
    name: ${KIBANA_NAME}
  elasticsearchRefs:
  - name: ${ELASTICSEARCH_NAME}
  mode: fleet
  fleetServerEnabled: true
  policyID: ${FLEET_SERVER_POLICY_ID}
  http:
    tls:
      selfSignedCertificate:
        disabled: true
  deployment:
    replicas: 1
    podTemplate:
      spec:
        serviceAccountName: elastic-agent
        automountServiceAccountToken: true
        securityContext:
          runAsUser: 0

---

apiVersion: agent.k8s.elastic.co/v1alpha1
kind: Agent
metadata:
  name: ${ELASTIC_AGENT_NAME}
  namespace: ${ELASTIC_STACK_NAMESPACE}
spec:
  version: ${ELASTIC_STACK_VERSION}
  kibanaRef:
    name: ${KIBANA_NAME}
  fleetServerRef:
    name: ${FLEET_SERVER_NAME}
  mode: fleet
  policyID: ${ELASTIC_AGENT_POLICY_ID}
  deployment:
    replicas: 1
    podTemplate:
      spec:
        serviceAccountName: elastic-agent
        automountServiceAccountToken: true
        securityContext:
          runAsUser: 0

---

apiVersion: v1
kind: Service
metadata:
  name: ${APM_FLEET_SERVICE_NAME}
  namespace: ${ELASTIC_STACK_NAMESPACE}
spec:
  selector:
    agent.k8s.elastic.co/name: ${ELASTIC_AGENT_NAME}
  ports:
  - protocol: TCP
    port: 8200
    targetPort: 8200

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: elastic-agent
rules:
- apiGroups: [""]
  resources:
  - pods
  - namespaces
  - nodes
  verbs:
  - get
  - watch
  - list
- apiGroups: ["apps"]
  resources:
  - replicasets
  verbs:
  - get
  - watch
  - list
- apiGroups: ["batch"]
  resources:
  - jobs
  verbs:
  - get
  - watch
  - list
- apiGroups: ["coordination.k8s.io"]
  resources:
  - leases
  verbs:
  - get
  - create
  - update

---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: elastic-agent
  namespace: ${ELASTIC_STACK_NAMESPACE}

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: elastic-agent
subjects:
- kind: ServiceAccount
  name: elastic-agent
  namespace: ${ELASTIC_STACK_NAMESPACE}
roleRef:
  kind: ClusterRole
  name: elastic-agent
  apiGroup: rbac.authorization.k8s.io
