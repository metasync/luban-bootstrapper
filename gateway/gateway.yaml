# Gateway Namespace and Gateway API Resources
# This file contains the core infrastructure: Namespace, GatewayClass, and Gateway.

apiVersion: v1
kind: Namespace
metadata:
  name: ${GATEWAY_NAMESPACE}
---
# Envoy GatewayClass and Gateway for HTTPS entrypoints
# to Argo Workflows and Argo CD.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: luban-envoy-proxy
    namespace: ${GATEWAY_NAMESPACE}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: luban-envoy-proxy
  namespace: ${GATEWAY_NAMESPACE}
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        patch:
          type: StrategicMerge
          value:
            spec:
              template:
                spec:
                  containers:
                  - name: envoy
                    livenessProbe:
                      timeoutSeconds: 5
                      periodSeconds: 10
                      failureThreshold: 6
                    readinessProbe:
                      timeoutSeconds: 5
                      periodSeconds: 10
                      failureThreshold: 6
                  - name: shutdown-manager
                    livenessProbe:
                      timeoutSeconds: 5
                      periodSeconds: 10
                      failureThreshold: 6
                    readinessProbe:
                      timeoutSeconds: 5
                      periodSeconds: 10
                      failureThreshold: 6
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: luban-gateway
  namespace: ${GATEWAY_NAMESPACE}
spec:
  gatewayClassName: envoy
  listeners:
  - name: luban-local
    protocol: HTTPS
    port: 443
    hostname: "*.${K8S_DOMAIN}"
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: luban-local-wildcard-tls
    allowedRoutes:
      namespaces:
        from: All
  - name: apps-local
    protocol: HTTPS
    port: 443
    hostname: "*.${APPS_DOMAIN}"
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: apps-local-wildcard-tls
    allowedRoutes:
      namespaces:
        from: All
  - name: luban-public
    protocol: HTTPS
    port: 443
    hostname: "*.${LUBAN_PUBLIC_DOMAIN}"
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: luban-public-wildcard-tls
    allowedRoutes:
      namespaces:
        from: All
  - name: apps-public
    protocol: HTTPS
    port: 443
    hostname: "*.${APPS_PUBLIC_DOMAIN}"
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: apps-public-wildcard-tls
    allowedRoutes:
      namespaces:
        from: All
