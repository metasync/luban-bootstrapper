# Public Ingress Configuration
# This file contains the configuration for public access via Cloudflare and Let's Encrypt.

# Cloudflare API Token Secret is created via Makefile from secrets/cloudflare.env
# Secret Name: cloudflare-api-token-secret
# Key: api-token

---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: letsencrypt-prod
  namespace: gateway
spec:
  acme:
    # The ACME server URL
    server: https://acme-v02.api.letsencrypt.org/directory
    # Email address used for ACME registration
    email: ci@metasync.cc
    # Name of a secret used to store the ACME account private key
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
    - dns01:
        cloudflare:
          apiTokenSecretRef:
            name: cloudflare-api-token-secret
            key: api-token
---
# Wildcard Certificate for *.luban.metasync.cc
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: luban-public-wildcard
  namespace: gateway
spec:
  secretName: luban-public-wildcard-tls
  dnsNames:
  - "*.luban.metasync.cc"
  issuerRef:
    name: letsencrypt-prod
    kind: Issuer
  duration: 2160h # 90d
  renewBefore: 360h # 15d
---
# Wildcard Certificate for *.apps.metasync.cc
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: apps-public-wildcard
  namespace: gateway
spec:
  secretName: apps-public-wildcard-tls
  dnsNames:
  - "*.apps.metasync.cc"
  issuerRef:
    name: letsencrypt-prod
    kind: Issuer
  duration: 2160h # 90d
  renewBefore: 360h # 15d
