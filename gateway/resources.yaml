# Gateway namespace and local CA setup.
# This creates a local CA used by cert-manager to issue TLS certificates
# for the Argo UIs exposed through Envoy Gateway.
apiVersion: v1
kind: Namespace
metadata:
  name: gateway
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: local-selfsigned
  namespace: gateway
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: local-ca
  namespace: gateway
spec:
  isCA: true
  commonName: local-ca
  secretName: local-ca-root
  duration: 43800h # 5y
  renewBefore: 720h # 30d
  issuerRef:
    name: local-selfsigned
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: local-ca-issuer
  namespace: gateway
spec:
  ca:
    secretName: local-ca-root
---
# Wildcard Certificate for *.luban.k8s.orb.local
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: luban-wildcard
  namespace: gateway
spec:
  secretName: luban-wildcard-tls
  dnsNames:
  - "*.luban.k8s.orb.local"
  issuerRef:
    name: local-ca-issuer
    kind: Issuer
  duration: 2160h # 90d
  renewBefore: 360h # 15d
---
# Envoy GatewayClass and Gateway for HTTPS entrypoints
# to Argo Workflows and Argo CD.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: luban-gateway
  namespace: gateway
spec:
  gatewayClassName: envoy
  listeners:
  - name: luban-ci
    protocol: HTTPS
    port: 443
    hostname: "*.luban.k8s.orb.local"
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: luban-wildcard-tls
    allowedRoutes:
      namespaces:
        from: All
  - name: harbor
    protocol: HTTPS
    port: 443
    hostname: harbor.k8s.orb.local
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: harbor-tls
    allowedRoutes:
      namespaces:
        from: All
  - name: argo-workflows
    protocol: HTTPS
    port: 443
    hostname: argo-workflows.k8s.orb.local
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: argo-workflows-tls
    allowedRoutes:
      namespaces:
        from: All
  - name: argocd
    protocol: HTTPS
    port: 443
    hostname: argocd.k8s.orb.local
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: argocd-tls
    allowedRoutes:
      namespaces:
        from: All
