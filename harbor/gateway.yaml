# Certificate and HTTPRoute for the Harbor UI.
# The Certificate is issued by the local CA in the "gateway" namespace,
# and the HTTPRoute binds the Harbor server to the Envoy Gateway listener.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: harbor-cert
  namespace: gateway
spec:
  secretName: harbor-tls
  dnsNames:
  - harbor.k8s.orb.local
  issuerRef:
    name: local-ca-issuer
    kind: Issuer
  duration: 2160h # 90d
  renewBefore: 360h # 15d
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: harbor-ui
  namespace: harbor
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: luban-gateway
    namespace: gateway
    sectionName: harbor
  hostnames:
  - harbor.k8s.orb.local
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: harbor
      port: 80
