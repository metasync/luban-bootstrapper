# Custom configuration for JupyterHub
hub:
  extraConfig:
    dagsterEnv: |
      def dagster_prefix(spawner):
          return f"/user/{spawner.user.name}/dagster"
      
      c.KubeSpawner.environment.update({
          "DAGSTER_WEBSERVER_PATH_PREFIX": dagster_prefix
      })
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

proxy:
  chp:
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

singleuser:
  image:
    name: quay.io/metasync/data-engineering-notebook
    tag: "2026-03-02"
    pullPolicy: Always
  cmd: null
  extraEnv:
    # Ensures the container runs the modern Jupyter Server to respect our config
    JUPYTERHUB_SINGLEUSER_APP: "jupyter_server.serverapp.ServerApp"
  memory:
    limit: 1G
    guarantee: 512M
  cpu:
    limit: 1
    guarantee: 0.2
  extraFiles:
    jupyter_server_config:
      mountPath: /etc/jupyter/jupyter_server_config.py
      stringData: |
        c.ContentsManager.allow_hidden = True

        # Jupyter Scheduler Configuration
        # Store the SQLite database in the user's persistent home directory
        # so that schedules and job history survive pod restarts.
        import os
        home_dir = os.environ.get('HOME', '/home/jovyan')
        db_path = os.path.join(home_dir, '.jupyter_scheduler.sqlite')
        c.SchedulerApp.db_url = f"sqlite:///{db_path}"

        # Jupyter Server Proxy Configuration
        c.ServerProxy.servers = {
          "dagster": {
            "port": 3000,
            "absolute_url": True,
            "launcher_entry": {
              "enabled": True,
              "title": "Dagster",
              "icon_path": ""
            }
          }
        }

scheduling:
  userScheduler:
    replicas: 1
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

prePuller:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
