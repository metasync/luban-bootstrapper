apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: ${KEYCLOAK_CR_NAME}
spec:
  instances: 1
  image: ${KEYCLOAK_IMAGE}
  startOptimized: false
  bootstrapAdmin:
    user:
      secret: ${KEYCLOAK_ADMIN_SECRET_NAME}
  db:
    vendor: postgres
    host: ${KEYCLOAK_DB_SERVICE_NAME}
    port: ${KEYCLOAK_DB_PORT}
    database: ${KEYCLOAK_DB_NAME}
    usernameSecret:
      name: ${KEYCLOAK_DB_SECRET_NAME}
      key: username
    passwordSecret:
      name: ${KEYCLOAK_DB_SECRET_NAME}
      key: password
  hostname:
    hostname: ${KEYCLOAK_CANONICAL_HOST}
    strict: false
  http:
    httpEnabled: true
  proxy:
    headers: xforwarded
  additionalOptions:
    - name: health-enabled
      value: "true"
    - name: metrics-enabled
      value: "true"
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      cpu: 1000m
      memory: 1536Mi
