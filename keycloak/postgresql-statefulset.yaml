apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${KEYCLOAK_DB_SERVICE_NAME}
spec:
  serviceName: ${KEYCLOAK_DB_SERVICE_NAME}
  replicas: 1
  selector:
    matchLabels:
      app: ${KEYCLOAK_DB_SERVICE_NAME}
  template:
    metadata:
      labels:
        app: ${KEYCLOAK_DB_SERVICE_NAME}
    spec:
      containers:
        - name: postgres
          image: ${KEYCLOAK_DB_IMAGE}
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: ${KEYCLOAK_DB_SECRET_NAME}
                  key: database
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: ${KEYCLOAK_DB_SECRET_NAME}
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${KEYCLOAK_DB_SECRET_NAME}
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
              name: postgres
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          startupProbe:
            exec:
              command:
                - sh
                - -ec
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: ${KEYCLOAK_DB_STORAGE_SIZE}
