apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakRealmImport
metadata:
  name: snd-realm-import
spec:
  keycloakCRName: ${KEYCLOAK_CR_NAME}
  realm:
    realm: snd
    enabled: true
    displayName: Sandbox
    sslRequired: external
    registrationAllowed: false
    registrationEmailAsUsername: false
    rememberMe: false
    verifyEmail: false
    loginWithEmailAllowed: true
    duplicateEmailsAllowed: false
    resetPasswordAllowed: true
    editUsernameAllowed: false
    groups:
      - name: dagster-access
    clientScopes:
      - name: groups
        description: Group membership claim for downstream authorization
        protocol: openid-connect
        attributes:
          include.in.token.scope: "true"
          display.on.consent.screen: "false"
          gui.order: ""
        protocolMappers:
          - name: groups
            protocol: openid-connect
            protocolMapper: oidc-group-membership-mapper
            consentRequired: false
            config:
              full.path: "false"
              id.token.claim: "true"
              access.token.claim: "true"
              userinfo.token.claim: "true"
              claim.name: groups
              jsonType.label: String
    clients:
      - clientId: snd-dagster-debug
        name: Sandbox Dagster Debug
        description: Bootstrap validation client for sandbox realm verification
        enabled: true
        protocol: openid-connect
        publicClient: true
        standardFlowEnabled: false
        implicitFlowEnabled: false
        directAccessGrantsEnabled: true
        serviceAccountsEnabled: false
        defaultClientScopes:
          - groups
          - profile
          - email
          - roles
          - web-origins
      - clientId: snd-dagster-gateway
        name: Sandbox Dagster Gateway
        description: Sandbox Dagster access gateway (OIDC Authorization Code + PKCE)
        enabled: true
        protocol: openid-connect
        publicClient: true
        standardFlowEnabled: true
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        redirectUris:
          - http://localhost:5173/oidc/callback
          - https://snd-dagster-gateway.apps.k8s.orb.local/oidc/callback
          - https://snd-dagster-gateway.apps.metasync.cc/oidc/callback
        webOrigins:
          - http://localhost:5173
          - https://snd-dagster-gateway.apps.k8s.orb.local
          - https://snd-dagster-gateway.apps.metasync.cc
        defaultClientScopes:
          - groups
          - profile
          - email
          - roles
          - web-origins
    users:
      - username: alice.dagster
        enabled: true
        emailVerified: true
        firstName: Alice
        lastName: Dagster
        email: alice.dagster@example.invalid
        groups:
          - dagster-access
        credentials:
          - type: password
            value: change-me-snd-alice
            temporary: false
      - username: blocked.dagster
        enabled: true
        emailVerified: true
        firstName: Blocked
        lastName: Dagster
        email: blocked.dagster@example.invalid
        credentials:
          - type: password
            value: change-me-snd-blocked
            temporary: false
